#
# Strict analysis for A.R.M.X AI.
# `flutter analyze` must report ZERO warnings and ZERO errors with this file.
# Generated sources are excluded because build_runner owns them.

include: package:flutter_lints/flutter_lints.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/l10n/generated/**"
    - "lib/main.g.dart"
    - "**/.dart_tool/**"
  errors:
    # Treat these as hard failures instead of hints.
    invalid_annotation_target: ignore # freezed + json_serializable on the same class
    missing_required_param: error
    missing_return: error
    todo: ignore # tracked in the README roadmap instead of in analyzer output
  plugins:
    - custom_lint
# NOTE: custom_lint (riverpod_lint) diagnostics are intentionally left at their
# package defaults. If a project-specific style hint ever needs silencing, add:
#
#   custom_lint:
#     rules:
#       - <rule_name>: false
#
# (rule names come from riverpod_lint's docs; they are versioned with the plugin).

linter:
  rules:
    - always_declare_return_types
    - always_put_required_named_parameters_first
    - avoid_equals_and_hash_code_on_mutable_classes
    - avoid_print
    - avoid_redundant_argument_values
    - avoid_returning_null_for_void
    - avoid_slow_async_io
    - avoid_unused_constructor_parameters
    - avoid_void_async
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - discarded_futures
    - eol_at_end_of_file
    - flutter_style_todos
    - join_return_with_assignment
    - leading_newlines_in_multiline_strings
    - literal_only_boolean_expressions
    - no_adjacent_strings_in_list
    - noop_primitive_operations
    - omit_local_variable_types
    - only_throw_errors
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - prefer_final_in_for_each
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - sized_box_for_whitespace
    - sort_child_properties_last
    - sort_constructors_first
    - sort_pub_dependencies
    - test_types_in_equals
    - throw_in_finally
    - unawaited_futures
    - unnecessary_await_in_return
    - unnecessary_lambdas
    - unnecessary_parenthesis
    - unnecessary_raw_strings
    - use_colored_box
    - use_decorated_box
    - use_enum_name
    - use_if_null_to_convert_nulls_to_bools
    - use_is_even_rather_than_modulo
    - use_named_constants
    - use_setters_to_change_properties
    - use_string_buffers
    - use_super_parameters
