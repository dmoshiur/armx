#
# A.R.M.X AI — Automated Resource Management eXtension (Flutter frontend).
#
# Every dependency is PINNED EXACTLY (no ^, no ranges) so a clone, a CI run and a release
# build resolve the identical graph. Rationale and the full pin table live in
# docs/decisions/0001-dependency-pins.md.
#
# This project is deliberately CODEGEN-FREE: there is no build_runner, no freezed, no
# drift, no json_serializable and no riverpod_generator. Models and providers are
# hand-written, so a fresh clone compiles after `flutter pub get` alone — see
# docs/decisions/0002-no-codegen.md.

name: armx_ai
description: >-
  A.R.M.X AI (Automated Resource Management eXtension) client application.
  Voice-first bilingual (Bengali + English) assistant platform with Admin, VIP and User
  roles, targeting phone, tablet, desktop and web from one codebase.
  Owner: Md. Moshiur Rahman Mohi. Brand: THAMJJ13.TOP. Proprietary software.
publish_to: "none"
version: 1.0.0+1

environment:
  # Flutter 3.47.5 ships Dart 3.13.4 (stable, 2026-09-18). Floor is 3.12.0 because
  # flutter_riverpod 3.4.3 and camera 0.12.1 both require Dart ^3.12.0 / Flutter >=3.44.0.
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ---- State management ----------------------------------------------------
  flutter_riverpod: 3.4.3

  # ---- Routing -------------------------------------------------------------
  go_router: 18.0.2

  # ---- Network -------------------------------------------------------------
  dio: 5.11.1 # the only HTTP client; screens never touch it directly
  web_socket_channel: 3.0.1 # assistant streaming + device telemetry

  # ---- Storage -------------------------------------------------------------
  flutter_secure_storage: 10.3.4 # JWT / refresh token ONLY (never SharedPreferences)
  shared_preferences: 2.5.3 # non-secret UI preferences only

  # ---- Localization + formatting -------------------------------------------
  intl: 0.20.3 # must match the version flutter_localizations pins on Flutter 3.47

  # ---- Security ------------------------------------------------------------
  crypto: 3.0.6 # SHA-256 for pairing fingerprints (no secrets in source)
  local_auth: 3.0.2 # re-auth for HIGH-risk confirmations; biometrics never leave the device

  # ---- Voice ---------------------------------------------------------------
  speech_to_text: 7.5.0 # push-to-talk + wake-word partials
  flutter_tts: 4.2.5 # spoken assistant replies (EN + BN)
  record: 7.1.1 # raw capture used by the voice-note and guest-greeter flows

  # ---- Vision / camera -----------------------------------------------------
  camera: 0.12.1 # guest-greeter preview (Android/iOS/web; desktop degrades honestly)
  qr_flutter: 4.1.0 # render the pairing QR
  mobile_scanner: 7.0.1 # decode a pairing QR (Android/iOS/web; manual entry is always offered too)
  flutter_overlay_window: 0.5.0 # the Android floating bubble (overlay + foreground-service glue)

  # ---- Platform ------------------------------------------------------------
  permission_handler: 13.0.2 # camera / mic / overlay / notification prompts

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0
  mocktail: 1.0.5

flutter:
  uses-material-design: true
  generate: true # runs `flutter gen-l10n` from l10n.yaml during pub get / build

  assets:
    - assets/images/
    - assets/brand/

  # Fonts are BUNDLED (no runtime font download, works fully offline, no third-party font
  # host, no privacy leak). This is why there is no `google_fonts` dependency: the spec
  # allows either, and a bundled local asset is the stronger choice for an
  # on-premises/estate product. Both files are variable fonts (Inter -> opsz,wght;
  # JetBrains Mono -> wght), so typography sets FontVariation values to render exact
  # weights instead of relying on synthetic emboldening.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf
